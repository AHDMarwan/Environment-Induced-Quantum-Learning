name: Hardware-informed EIQL experiments

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiments/hardware-informed-suite
    paths:
      - "experiments/09_finite_shot_theorem2/**"
      - "experiments/10_conditional_correlation/**"
      - "experiments/11_multiclass_views/**"
      - "experiments/12_collision_virtual/**"
      - "requirements.txt"
      - ".github/workflows/hardware-informed-experiments.yml"
  pull_request:
    paths:
      - "experiments/09_finite_shot_theorem2/**"
      - "experiments/10_conditional_correlation/**"
      - "experiments/11_multiclass_views/**"
      - "experiments/12_collision_virtual/**"
      - "requirements.txt"
      - ".github/workflows/hardware-informed-experiments.yml"

permissions:
  contents: read

jobs:
  experiment:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: finite-shot-theorem2
            script: experiments/09_finite_shot_theorem2/theorem2_finite_shot.py
            output: experiments/09_finite_shot_theorem2/outputs
          - name: conditional-correlation
            script: experiments/10_conditional_correlation/conditional_correlation_stress.py
            output: experiments/10_conditional_correlation/outputs
          - name: multiclass-two-vs-three
            script: experiments/11_multiclass_views/multiclass_two_vs_three.py
            output: experiments/11_multiclass_views/outputs
          - name: collision-virtual-phase-diagram
            script: experiments/12_collision_virtual/collision_phase_diagram.py
            output: experiments/12_collision_virtual/outputs

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark
        env:
          MPLBACKEND: Agg
          PYTHONHASHSEED: "0"
        run: python "${{ matrix.script }}"

      - name: Upload numerical outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-outputs
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30
